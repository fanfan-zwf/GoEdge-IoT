<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" fill="none">
  <!-- PLC 机柜剪影：多立柱机柜 + 天线 + 指示灯 -->
  <g class="plc-cabs" fill="currentColor" opacity="0.9">
    <!-- Cabinet 1 -->
    <g transform="translate(40,80)">
      <rect x="0" y="0" width="86" height="300" rx="4" />
      <rect x="8" y="18" width="70" height="8" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="34" width="70" height="8" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="50" width="70" height="8" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="80" width="70" height="150" rx="3" fill="#000" opacity="0.5" />
      <circle cx="20" cy="248" r="3" fill="#4dd0e1" opacity="0.9" />
      <circle cx="34" cy="248" r="3" fill="#3ddc97" opacity="0.9" />
      <circle cx="48" cy="248" r="3" fill="#ff8a3d" opacity="0.9" />
      <rect x="60" y="240" width="14" height="4" fill="#000" opacity="0.4" />
      <!-- antenna -->
      <line x1="43" y1="0" x2="43" y2="-38" stroke="currentColor" stroke-width="2" />
      <circle cx="43" cy="-42" r="4" fill="#4dd0e1" />
    </g>

    <!-- Cabinet 2 -->
    <g transform="translate(140,60)">
      <rect x="0" y="0" width="96" height="320" rx="4" />
      <rect x="10" y="20" width="76" height="10" rx="2" fill="#000" opacity="0.35" />
      <rect x="10" y="38" width="76" height="10" rx="2" fill="#000" opacity="0.35" />
      <rect x="10" y="56" width="76" height="10" rx="2" fill="#000" opacity="0.35" />
      <rect x="10" y="86" width="76" height="180" rx="3" fill="#000" opacity="0.5" />
      <circle cx="24" cy="282" r="3" fill="#3ddc97" />
      <circle cx="38" cy="282" r="3" fill="#4dd0e1" />
      <rect x="66" y="278" width="18" height="6" fill="#000" opacity="0.4" />
    </g>

    <!-- Cabinet 3 -->
    <g transform="translate(252,100)">
      <rect x="0" y="0" width="80" height="280" rx="4" />
      <rect x="8" y="18" width="64" height="8" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="34" width="64" height="8" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="66" width="64" height="130" rx="3" fill="#000" opacity="0.5" />
      <circle cx="20" cy="222" r="3" fill="#4dd0e1" />
      <line x1="40" y1="0" x2="40" y2="-52" stroke="currentColor" stroke-width="2" />
      <circle cx="40" cy="-56" r="4" fill="#ff8a3d" />
    </g>

    <!-- Cabinet 4 tall -->
    <g transform="translate(348,40)">
      <rect x="0" y="0" width="102" height="340" rx="4" />
      <rect x="10" y="20" width="82" height="10" rx="2" fill="#000" opacity="0.35" />
      <rect x="10" y="38" width="82" height="10" rx="2" fill="#000" opacity="0.35" />
      <rect x="10" y="56" width="82" height="10" rx="2" fill="#000" opacity="0.35" />
      <rect x="10" y="88" width="82" height="200" rx="3" fill="#000" opacity="0.5" />
      <circle cx="26" cy="304" r="3" fill="#3ddc97" />
      <circle cx="42" cy="304" r="3" fill="#4dd0e1" />
      <circle cx="58" cy="304" r="3" fill="#ff8a3d" />
    </g>

    <!-- Cabinet 5 -->
    <g transform="translate(466,90)">
      <rect x="0" y="0" width="86" height="290" rx="4" />
      <rect x="8" y="18" width="70" height="8" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="34" width="70" height="8" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="66" width="70" height="150" rx="3" fill="#000" opacity="0.5" />
      <circle cx="20" cy="238" r="3" fill="#4dd0e1" />
      <line x1="43" y1="0" x2="43" y2="-46" stroke="currentColor" stroke-width="2" />
      <circle cx="43" cy="-50" r="4" fill="#3ddc97" />
    </g>

    <!-- Cabinet 6 small -->
    <g transform="translate(566,140)">
      <rect x="0" y="0" width="70" height="240" rx="4" />
      <rect x="8" y="16" width="54" height="6" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="28" width="54" height="6" rx="2" fill="#000" opacity="0.35" />
      <rect x="8" y="52" width="54" height="120" rx="3" fill="#000" opacity="0.5" />
      <circle cx="18" cy="192" r="3" fill="#ff8a3d" />
    </g>

    <!-- Cabinet 7 -->
    <g transform="translate(650,110)">
      <rect x="0" y="0" width="60" height="270" rx="4" />
      <rect x="6" y="16" width="48" height="6" rx="2" fill="#000" opacity="0.35" />
      <rect x="6" y="30" width="48" height="6" rx="2" fill="#000" opacity="0.35" />
      <rect x="6" y="54" width="48" height="140" rx="3" fill="#000" opacity="0.5" />
    </g>
  </g>

  <!-- 地面 -->
  <line x1="0" y1="382" x2="720" y2="382" stroke="currentColor" stroke-width="1" opacity="0.3" />
  <line x1="0" y1="392" x2="720" y2="392" stroke="currentColor" stroke-width="1" opacity="0.15" />
</svg>
